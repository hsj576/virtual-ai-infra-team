name: Bug report
description: Report a reproducible problem in installation, serving, evolution, or rollback.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, control signatures, private prompts, model outputs, or personal paths.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS version, chip, unified memory, Python, MLX and MLX-VLM versions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, model data, private prompts, control tokens, and personal paths.
          required: true
