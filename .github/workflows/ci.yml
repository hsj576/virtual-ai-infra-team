name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests -q
      - run: python -m compileall -q src
      - run: python examples/qwen38-dflash2-m5pro/verify_evidence.py

  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/infra-team-wheel-test
          /tmp/infra-team-wheel-test/bin/pip install dist/*.whl
          cd /tmp
          /tmp/infra-team-wheel-test/bin/infra-team --help
          /tmp/infra-team-wheel-test/bin/infra-team registry list --json
          /tmp/infra-team-wheel-test/bin/infra-team memory show --json
      - name: Check release tree for secrets and personal paths
        run: python scripts/check-release.py
